[package]
name = "watermark-tool"
version = "1.4.0"
edition = "2024"
authors = ["ikenxuan"]
description = "用于向图片嵌入和提取数字盲水印的桌面工具"
license = "MIT"
repository = "https://github.com/ikenxuan/watermark"
homepage = "https://github.com/ikenxuan/watermark"

[lib]
name = "dwt_watermark_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "watermark-tool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dwt-watermark-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
